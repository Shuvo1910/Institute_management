<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uni. | {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
      :root { --brand:#4f46e5; --brand-dark:#3730a3; --surface:#ffffff; --bg:#f5f7fb; --text:#1f2937; --muted:#6b7280; }
      body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; }
      .navbar { background:linear-gradient(135deg,var(--brand),var(--brand-dark)); box-shadow:0 4px 18px rgba(79,70,229,.25); }
      .navbar .navbar-brand,.navbar .nav-link { color:#fff !important; font-weight:500; }
      .navbar .nav-link:hover { color:#c7d2fe !important; }
      .navbar-toggler { border-color:rgba(255,255,255,.4); }
      .navbar-toggler-icon { filter:invert(1); }
      .container { max-width:1200px; }
      .page-card { background:var(--surface); border-radius:16px; padding:28px; box-shadow:0 10px 30px rgba(0,0,0,.06); }
      h1,h2,h3 { font-weight:700; letter-spacing:-.3px; }
      .btn { border-radius:10px; font-weight:600; padding:8px 18px; }
      .btn-primary { background:var(--brand); border-color:var(--brand); }
      .btn-primary:hover { background:var(--brand-dark); border-color:var(--brand-dark); }
      .table { border-radius:12px; overflow:hidden; }
      .table thead { background:var(--brand); color:#fff; }
      .table thead th { border:none; font-weight:600; }
      .table tbody tr:hover { background:#eef2ff; }
      .form-control,.form-select { border-radius:10px; padding:10px 14px; }
      .alert { border-radius:12px; }
      .badge { border-radius:8px; }
      img { border-radius:8px; }
      .card { border:none; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.06); }
    </style>
  </head>
  <body>
    {% include 'master/nav.html' %}
    <div class="container py-4">
      {% include 'master/messages.html' %}
      <div class="page-card">
        {% block body %}{% endblock %}
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
