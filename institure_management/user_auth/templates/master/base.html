<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uni. | {% block title %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>

    :root {
      --pine: #0f2f2b;
      --pine-2: #17433d;
      --brand: #12805c;
      --brand-dark: #0d6a4b;
      --brand-tint: #e6f3ed;
      --amber: #f2b134;
      --paper: #f2f4f1;
      --surface: #ffffff;
      --line: #dfe5e1;
      --ink: #16211e;
      --ink-2: #3b4a45;
      --muted: #62706b;
      --r-ctl: 10px;
      --r-card: 14px;
      --r-panel: 18px;
      --font-head: 'Bricolage Grotesque', 'Hanken Grotesk', system-ui, sans-serif;
      --font-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --bs-primary: #12805c;
      --bs-primary-rgb: 18, 128, 92;
      --bs-link-color: #12805c;
      --bs-link-hover-color: #0d6a4b;
      --bs-body-font-family: var(--font-body);
      --bs-body-color: var(--ink);
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: .97rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--font-head);
      font-weight: 700;
      letter-spacing: -.02em;
      color: var(--ink);
    }

    h1 {
      font-size: 1.7rem;
    }

    h2 {
      font-size: 1.3rem;
    }

    ::selection {
      background: #cfe9de;
    }

    :focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .container {
      max-width: 1200px;
    }

    /* ===== Navbar ===== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1030;
      background: var(--pine);
      padding: .65rem 0;
      border-bottom: 3px solid var(--amber);
    }

    .navbar>.container-fluid {
      max-width: 1200px;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: .65rem;
      margin: 0;
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -.02em;
      color: #fff !important;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--amber);
      color: var(--pine);
      font-size: 1.1rem;
    }

    .navbar .nav-link {
      display: flex;
      align-items: center;
      color: rgba(255, 255, 255, .78) !important;
      font-weight: 600;
      font-size: .88rem;
      padding: .5rem .75rem !important;
      border-radius: var(--r-ctl);
      transition: background .15s, color .15s;
    }

    .navbar .nav-link .bi {
      margin-right: .4rem;
      font-size: .95rem;
    }

    .navbar .nav-link:hover {
      background: rgba(255, 255, 255, .09);
      color: #fff !important;
    }

    .navbar .nav-link.active {
      background: rgba(255, 255, 255, .16);
      color: #fff !important;
    }

    .navbar .nav-link.nav-logout {
      color: #ffc7bd !important;
    }

    .navbar .nav-link.nav-logout:hover {
      background: rgba(255, 120, 100, .18);
      color: #fff !important;
    }

    .navbar-toggler {
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: var(--r-ctl);
      padding: .4rem .6rem;
    }

    .navbar-toggler:focus {
      box-shadow: 0 0 0 3px rgba(242, 177, 52, .4);
    }

    .navbar-toggler-icon {
      filter: invert(1);
    }

    @media (max-width:991.98px) {
      .navbar-collapse {
        padding: .75rem 0 .25rem;
      }

      .navbar .nav-link {
        padding: .7rem .85rem !important;
      }
    }

    @media (min-width:992px) and (max-width:1199.98px) {
      .navbar .nav-link .bi {
        display: none;
      }

      .navbar .nav-link {
        padding: .5rem .6rem !important;
        font-size: .84rem;
      }
    }

    /* ===== Page interface ===== */
    .page-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-panel);
      padding: 32px;
    }

    .page-card .card {
      box-shadow: none;
    }

    @media (max-width:575.98px) {
      .page-card {
        padding: 18px;
        border-radius: var(--r-card);
      }
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.4rem;
    }

    .page-head h1 {
      margin: 0;
    }

    .page-head .sub {
      margin: .2rem 0 0;
      color: var(--muted);
      font-size: .92rem;
    }

    /* ===== Button ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      border-radius: var(--r-ctl);
      font-weight: 600;
      font-size: .9rem;
      padding: .55rem 1.1rem;
      transition: background .15s, border-color .15s, color .15s;
    }

    .btn-sm {
      font-size: .8rem;
      padding: .35rem .7rem;
    }

    .btn-primary {
      --bs-btn-bg: var(--brand);
      --bs-btn-border-color: var(--brand);
      --bs-btn-hover-bg: var(--brand-dark);
      --bs-btn-hover-border-color: var(--brand-dark);
      --bs-btn-active-bg: var(--brand-dark);
      --bs-btn-active-border-color: var(--brand-dark);
      --bs-btn-disabled-bg: var(--brand);
      --bs-btn-disabled-border-color: var(--brand);
      --bs-btn-focus-shadow-rgb: 18, 128, 92;
    }

    .btn-soft {
      --c: 18, 128, 92;
      background: rgba(var(--c), .1);
      color: rgb(var(--c));
      border: 1px solid transparent;
    }

    .btn-soft:hover,
    .btn-soft:focus-visible {
      background: rgba(var(--c), .19);
      color: rgb(var(--c));
    }

    .btn-soft-edit {
      --c: 168, 98, 6;
    }

    .btn-soft-danger {
      --c: 190, 30, 45;
    }

    .btn-soft-neutral {
      --c: 59, 74, 69;
    }

    .actions {
      display: flex;
      gap: .4rem;
      justify-content: flex-end;
    }

    .actions form {
      margin: 0;
    }

    /* ===== Table ===== */
    .table-wrap {
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      background: #fff;
    }

    .table {
      --bs-table-bg: transparent;
      --bs-table-hover-bg: #f5f9f7;
      margin: 0;
      font-size: .93rem;
    }

    .table thead th {
      background: #f6f8f6;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 600;
      padding: .8rem 1rem;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    .table tbody td {
      padding: .75rem 1rem;
      border-color: var(--line);
      color: var(--ink-2);
    }

    .table tbody tr:last-child td {
      border-bottom: 0;
    }

    .table td.name {
      color: var(--ink);
      font-weight: 600;
    }

    .avatar-sm {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--line);
    }

    .avatar-ph {
      display: inline-grid;
      place-items: center;
      background: var(--brand-tint);
      color: var(--brand);
      font-size: 1.2rem;
    }

    .thumb {
      width: 84px;
      height: 54px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--line);
    }

    .thumb.avatar-ph {
      display: inline-grid;
      border-radius: 8px;
    }

    .pill {
      display: inline-block;
      padding: .18rem .65rem;
      border-radius: 99px;
      background: #eef2ef;
      color: var(--ink-2);
      font-weight: 600;
      font-size: .8rem;
    }

    .pill-ok {
      background: var(--brand-tint);
      color: var(--brand-dark);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 2.5rem 1rem !important;
    }

    .empty .bi {
      display: block;
      font-size: 1.9rem;
      opacity: .55;
      margin-bottom: .35rem;
    }

    /* ===== Form css ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-card);
    }

    .form-head {
      padding-bottom: 1rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
    }

    .form-head h1 {
      margin: 0;
      font-size: 1.45rem;
    }

    .form-actions {
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
    }

    label,
    .form-label {
      font-weight: 600;
      font-size: .86rem;
      color: var(--ink-2);
      margin-bottom: .35rem;
    }

    .asteriskField {
      color: #c62839;
      margin-left: 2px;
    }

    .form-control,
    .form-select {
      border-radius: var(--r-ctl);
      border: 1px solid #ccd5d0;
      padding: .62rem .85rem;
      background-color: #fff;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(18, 128, 92, .14);
    }

    .form-control::placeholder {
      color: #9aa8a3;
    }

    .form-text,
    .helptext {
      color: var(--muted);
      font-size: .8rem;
    }

    .invalid-feedback,
    .text-danger {
      font-size: .82rem;
    }

    .form-check-input:checked {
      background-color: var(--brand);
      border-color: var(--brand);
    }

    /* ===== aleart  ===== */
    .alert {
      display: flex;
      align-items: center;
      gap: .65rem;
      border: 1px solid transparent;
      border-radius: 12px;
      font-weight: 500;
      font-size: .92rem;
      padding: .8rem 1rem;
    }

    .alert>div {
      flex: 1;
    }

    .alert .btn-close {
      position: static;
      padding: .5rem;
      margin-left: auto;
    }

    .alert-dismissible {
      padding-right: 1rem;
    }

    .alert-success {
      background: #e8f6ee;
      color: #0b5a3b;
      border-color: #b8e0cb;
    }

    .alert-danger,
    .alert-error {
      background: #fdeeee;
      color: #8f1d2a;
      border-color: #f3c1c6;
    }

    .alert-warning {
      background: #fff6e0;
      color: #7a4a05;
      border-color: #f4dc9b;
    }

    .alert-info,
    .alert-debug {
      background: #e9f2f7;
      color: #1b4b66;
      border-color: #bfd9e7;
    }

    .badge {
      border-radius: 8px;
      font-weight: 600;
      padding: .4em .7em;
    }

    .badge-soft {
      background: var(--brand-tint);
      color: var(--brand-dark);
    }

    /* ===== Dashboard ===== */
    .hero {
      position: relative;
      overflow: hidden;
      background: var(--pine);
      color: #fff;
      border-radius: var(--r-card);
      padding: 2.25rem 2rem 2.4rem;
    }

    .hero::after {
      content: "";
      position: absolute;
      left: 2rem;
      bottom: 0;
      width: 72px;
      height: 4px;
      background: var(--amber);
      border-radius: 4px 4px 0 0;
    }

    .hero h1 {
      color: #fff;
      font-size: clamp(1.6rem, 3.6vw, 2.4rem);
      margin: 0 0 .5rem;
    }

    .hero p {
      margin: 0;
      color: rgba(255, 255, 255, .72);
      max-width: 52ch;
    }

    .hero .role {
      display: inline-block;
      margin-top: 1.1rem;
      padding: .2rem .7rem;
      border-radius: 99px;
      background: rgba(255, 255, 255, .12);
      color: #fff;
      font-size: .8rem;
      font-weight: 600;
    }

    .section-title {
      font-size: 1.05rem;
      margin: 1.8rem 0 .9rem;
    }

    .tile {
      display: flex;
      align-items: center;
      gap: .95rem;
      height: 100%;
      padding: 1rem 1.1rem;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      color: var(--ink);
      text-decoration: none;
      transition: border-color .15s, background .15s;
    }

    .tile:hover {
      border-color: var(--brand);
      background: #f7fbf9;
      color: var(--ink);
    }

    .tile .ico {
      flex: none;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--brand-tint);
      color: var(--brand);
      font-size: 1.25rem;
    }

    .tile strong {
      display: block;
      font-weight: 700;
      font-size: .95rem;
    }

    .tile .sub {
      display: block;
      color: var(--muted);
      font-size: .8rem;
    }

    .tile .go {
      margin-left: auto;
      color: var(--muted);
    }

    /* ===== Profile ===== */
    .profile-card {
      overflow: hidden;
    }

    .profile-cover {
      height: 104px;
      background: var(--pine);
      border-bottom: 4px solid var(--amber);
    }

    .avatar-xl {
      display: block;
      width: 132px;
      height: 132px;
      margin: -66px auto 0;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #fff;
      background: #fff;
    }

    .avatar-xl.ph {
      display: grid;
      place-items: center;
      background: var(--brand-tint);
      color: var(--brand);
      font-size: 3rem;
    }

    .profile-table th {
      width: 40%;
      color: var(--muted);
      font-weight: 600;
      font-size: .88rem;
      padding: .7rem 0;
      border-bottom: 1px solid var(--line);
    }

    .profile-table td {
      color: var(--ink);
      font-weight: 600;
      text-align: right;
      padding: .7rem 0;
      border-bottom: 1px solid var(--line);
    }

    .profile-table tr:last-child th,
    .profile-table tr:last-child td {
      border-bottom: 0;
    }

    /* ===== Login ===== */
    .auth-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 1rem;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: var(--pine);
      color: var(--amber);
      font-size: 1.7rem;
    }
  </style>
</head>

<body>
  {% include 'master/nav.html' %}
  <div class="container py-4 py-lg-5">
    {% include 'master/messages.html' %}
    <div class="page-card">
      {% block body %}{% endblock %}
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
