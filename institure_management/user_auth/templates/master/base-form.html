{% extends 'master/base.html' %}
{% block title %}
  {{ page_title }}
{% endblock %}
{% load crispy_forms_tags %}
{% block body %}
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card p-4">
        <div class="form-head">
          <h1>{{ form_title }}</h1>
        </div>
        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form_data|crispy }}
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ form_btn }}</button>
            <a href="javascript:history.back()" class="btn btn-soft btn-soft-neutral">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
